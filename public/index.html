<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3efe5" />
    <meta
      name="description"
      content="Alabama Wholesale — orders, inventory and customer accounts in one place."
    />
    <title>Alabama Wholesale</title>
    <link
      rel="preload"
      href="/assets/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/gemini-chat.css" />
    <link rel="stylesheet" href="/order-selection.css" />
    <link rel="stylesheet" href="/store-picker.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <main id="main" class="boot">
        <div class="brand">
          <img
            class="brand-logo"
            src="/assets/logo.png"
            alt="Alabama Wholesale"
            width="1050"
            height="370"
          />
        </div>
        <h1>Alabama Wholesale</h1>
        <p>Opening your workspace…</p>
      </main>
    </div>
    <div
      id="announcements"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
    <noscript
      >JavaScript is required to use the Alabama Wholesale ordering
      workspace.</noscript
    >
  </body>
</html>
